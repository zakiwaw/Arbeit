# Prüfskripte bei jedem Push auf den Live-Zweig (und für Pull Requests nach main). Kein Build, kein package.json:
# die Tests brauchen nur Node, Python (Mini-Server) und das auf dem Runner vorinstallierte Google Chrome;
# puppeteer-core wird außerhalb des Repos installiert. Details und Handprobe: tests/README.md
name: Tests

on:
  push:
    branches: [arena/01a06f82-arbeit]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ohne-chrome:
    name: Ohne Chrome (Server-Skript, Versionen, Aufbau)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versionsangaben
        run: node tests/versioncheck.js
      - name: Aufbau (js/, css/, sw.js, Code.gs)
        if: ${{ !cancelled() }}
        run: node tests/aufbaucheck.js
      - name: Server-Skript (Code.gs nachgebildet)
        if: ${{ !cancelled() }}
        run: node tests/backendcheck.js

  chrome:
    name: Im Chrome (App-Verhalten)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: puppeteer-core bereitstellen (außerhalb des Repos)
        run: |
          mkdir -p /tmp/pup && cd /tmp/pup
          npm init -y > /dev/null
          npm install --no-audit --no-fund puppeteer-core@23
      - name: Chrome finden, App lokal ausliefern
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)
          echo "Chrome: $CHROME ($($CHROME --version))"
          echo "CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "PUPPETEER_MODULE=/tmp/pup/node_modules/puppeteer-core" >> "$GITHUB_ENV"
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:8000/index.html
      - name: regress (Scan, Batch, Startseite, Unterseiten, Info-Filter)
        run: node tests/regress.js
      - name: synccheck (Löschen/Deaktivieren bei gestörtem Netz)
        if: ${{ !cancelled() }}
        run: node tests/synccheck.js
      - name: authcheck (Anmeldung, PIN, 30-Minuten-Abmeldung)
        if: ${{ !cancelled() }}
        run: node tests/authcheck.js
      - name: desktopcheck (Desktop-Layout ab 992 px)
        if: ${{ !cancelled() }}
        run: node tests/desktopcheck.js
      - name: erfassencheck (Seite „Aufträge erfassen“)
        if: ${{ !cancelled() }}
        run: node tests/erfassencheck.js
      - name: importcheck (Drive-Import Ende-zu-Ende)
        if: ${{ !cancelled() }}
        run: node tests/importcheck.js
      - name: soundcheck (Töne)
        if: ${{ !cancelled() }}
        run: node tests/soundcheck.js
      - name: zoomcheck (Browser-Zoom gesperrt)
        if: ${{ !cancelled() }}
        run: node tests/zoomcheck.js
      - name: offlinecheck (Service Worker, Offline-Scan)
        if: ${{ !cancelled() }}
        run: node tests/offlinecheck.js
