<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Fracht Tracker (V9)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Lade-Overlay: wird beim Start eingeblendet, bis die Daten geladen sind -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Obere Steuerzeile: Menü + Batch-Schalter -->
    <header class="top-bar">
        <button id="menu-toggle-btn" class="icon-btn" aria-label="Optionen öffnen" title="Optionen">☰</button>
        <div class="top-bar-title">Fracht Tracker</div>
        <div class="top-bar-batch">
            <label for="batchModeToggle">Batch-Modus:</label>
            <label class="toggle-switch">
                <input type="checkbox" id="batchModeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <main>

        <!-- Scan-Bereich -->
        <section class="card scan-card">
            <form id="scanForm" autocomplete="off">
                <div class="scan-row">
                    <div class="input-wrap">
                        <input type="text" id="shipmentNumberInput"
                               placeholder="Scannen oder eingeben…"
                               autocapitalize="characters" autocomplete="off"
                               enterkeyhint="enter" spellcheck="false">
                        <button type="button" id="clearInputButton" class="clear-btn hidden" title="Eingabe leeren">×</button>
                    </div>
                    <button type="button" id="noteButton" class="icon-btn note-btn" title="Notiz hinzufügen/bearbeiten (Einzelscan)">📝</button>
                </div>
            </form>

            <!-- Neue Sendung: erwartetе Gesamtstückzahl abfragen -->
            <div id="newShipmentSection" class="new-shipment hidden">
                <label for="newShipmentCount">Erwartete Gesamtstückzahl für NEUE Sendung: <strong id="newShipmentNumber"></strong></label>
                <div class="row">
                    <input type="text" id="newShipmentCount" inputmode="numeric" placeholder="Zahl eingeben…">
                    <button type="button" id="confirmNewShipmentButton" class="btn primary">Bestätigen</button>
                    <button type="button" id="cancelNewShipmentButton" class="btn secondary">Abbrechen</button>
                </div>
            </div>

            <!-- Notiz für den nächsten Einzelscan -->
            <div id="noteSection" class="note-section hidden">
                <form id="singleNoteForm">
                    <label for="singleNoteInput">Notiz (für nächsten Einzelscan):</label>
                    <div class="row">
                        <input type="text" id="singleNoteInput" placeholder="Notiztext eingeben…" autocomplete="off">
                        <button type="submit" class="btn primary">Speichern</button>
                        <button type="button" id="cancelNoteButton" class="btn secondary">Abbrechen</button>
                    </div>
                </form>
            </div>

            <!-- Status-Auswahl + Kombi-Sicherung -->
            <div class="status-row">
                <label for="securityStatusSelect" class="visually-hidden">Sicherungs-Status</label>
                <select id="securityStatusSelect">
                    <option value="XRY">XRY</option>
                    <option value="ETD">ETD</option>
                    <option value="EDD">EDD</option>
                    <option value="Wareneingang">Wareneingang</option>
                    <option value="Dunkelalarm">Dunkelalarm</option>
                    <option value="Anstehend">Anstehend</option>
                    <option value="NichtSichern">Nicht Erf.</option>
                    <option value="Abgelehnt">Abgelehnt</option>
                </select>
                <div id="comboLine" class="combo-line">
                    <label class="combo-label">
                        <input type="checkbox" id="comboCheckbox">
                        <span>Kombi-Sicherung</span>
                    </label>
                </div>
            </div>

            <!-- Feedback / Fehlermeldungen -->
            <div id="feedbackMessage" class="feedback-message" role="status" aria-live="polite"></div>
        </section>

        <!-- Batch-Bereich (nur im Batch-Modus sichtbar) -->
        <section id="batchArea" class="batch-area hidden">
            <h2 class="batch-title">Batch-Modus aktiv</h2>
            <div id="batchCount" class="batch-count">Anzahl: 0</div>
            <div id="batchList" class="batch-list"></div>
            <div id="batchNoteRow" class="row hidden">
                <input type="text" id="batchNoteInput" placeholder="Notiz für alle Batch-Scans…">
            </div>
            <div class="row">
                <button type="button" id="saveBatchButton" class="btn primary">Speichern</button>
                <button type="button" id="clearBatchButton" class="btn warning">Leeren</button>
            </div>
        </section>

        <!-- Zusatzoptionen -->
        <div class="extra-toggles">
            <label class="toggle-label">
                <span>💬 Scan-Feedback-Popup</span>
                <label class="toggle-switch small">
                    <input type="checkbox" id="batchFeedbackToggle">
                    <span class="slider"></span>
                </label>
            </label>
            <label class="toggle-label">
                <span>🗒️ Batch-Notiz</span>
                <label class="toggle-switch small">
                    <input type="checkbox" id="batchNoteToggle">
                    <span class="slider"></span>
                </label>
            </label>
        </div>

        <!-- Suche/Filter über der Sendungsliste (nur Anzeige, ändert keine Daten) -->
        <input type="search" id="shipmentSearchInput" class="search-input" placeholder="🔍 Sendungen durchsuchen…" autocomplete="off">

        <!-- Sendungsliste -->
        <section id="shipmentList" class="shipment-list" aria-label="Sendungsliste"></section>

        <!-- Detailansicht der aktuell gewählten Sendung -->
        <section id="currentShipmentDetails" class="card details-card">
            <div id="detailsPlaceholder" class="details-placeholder">Geben Sie eine Sendungsnummer ein...</div>
            <div id="detailsContent" class="hidden"></div>
        </section>

    </main>

    <!-- Overlay hinter dem Seitenmenü -->
    <div id="menu-overlay" class="menu-overlay hidden"></div>

    <!-- Seitenmenü (Optionen) -->
    <aside id="sideMenu" class="side-menu" aria-label="Optionen">
        <h2>Optionen</h2>
        <button id="importHuButton" class="menu-btn warning">📤 HU-Liste importieren</button>
        <button id="showOpenHusButton" class="menu-btn info">👁 Offene HUs anzeigen</button>
        <button id="sendToSheetButton" class="menu-btn primary">☁️ An Google Sheet Senden</button>
        <div id="sheetStatus" class="sheet-status"></div>
        <button id="sendSummaryEmailButton" class="menu-btn warning">✉️ Zusammenfassung per E-Mail</button>
        <button id="resetDataButton" class="menu-btn danger">🗑️ Alles Zurücksetzen</button>
        <div id="lkw-section" class="lkw-section">
            <h3>Aktive LKW</h3>
            <button id="addTruckButton" class="menu-btn primary small-menu-btn">➕ LKW hinzufügen</button>
            <div id="lkw-menu-container"></div>
        </div>
    </aside>

    <!-- Modal: HU-Liste importieren -->
    <div id="huImportModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" data-close-modal title="Schließen">×</button>
            <h2>HU-Liste Importieren</h2>
            <label for="mainOrderNumberInput">Auftragsnummer (z.B. 9007769889):</label>
            <div class="row">
                <input type="text" id="mainOrderNumberInput"
                       placeholder="Übergeordnete Auftragsnummer eingeben"
                       inputmode="none" autocapitalize="characters" autocomplete="off">
                <button type="button" id="addAndContinueHuButton" class="btn primary square" title="Speichern und nächste Liste eingeben">+</button>
            </div>
            <label for="huListTextarea">HU-Nummern (eine pro Zeile):</label>
            <textarea id="huListTextarea" rows="8" placeholder="HU Nummern hier einfügen…" spellcheck="false"></textarea>
            <div id="huImportStatus" class="hu-import-status"></div>
            <div class="row">
                <button type="button" id="importHuConfirmButton" class="btn primary">Importieren &amp; Speichern</button>
                <button type="button" class="btn secondary" data-close-modal>Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Offene HUs (3 Tabs) -->
    <div id="openHusModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" data-close-modal title="Schließen">×</button>
            <h2>Offene HUs</h2>
            <div class="hus-tabs">
                <button class="hus-tab active" data-hutab="offeneSicherung">Offene Sicherung</button>
                <button class="hus-tab" data-hutab="fehlendeEingaenge">Fehlende Eingänge <span id="missingReceiptsBadge" class="badge hidden"></span></button>
                <button class="hus-tab" data-hutab="dunkelalarm">Dunkelalarm <span id="dunkelalarmBadge" class="badge hidden"></span></button>
            </div>
            <div id="husTabContent" class="hus-tab-content"></div>
        </div>
    </div>

    <!-- Modal: HU-Details -->
    <div id="huDetailsModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" data-close-modal title="Schließen">×</button>
            <h2>HU-Details</h2>
            <dl id="huDetailsList" class="hu-details-list"></dl>
        </div>
    </div>

    <!-- Modal: Sendung bearbeiten -->
    <div id="editModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" data-close-modal title="Schließen">×</button>
            <h2>Sendung Bearbeiten</h2>
            <form id="edit-form">
                <label for="editShipmentNumber">Sendungsnummer:</label>
                <input type="text" id="editShipmentNumber" readonly>
                <label for="editManualWeCount">Manuelle Anzahl Wareneingang:</label>
                <input type="text" id="editManualWeCount" inputmode="numeric" placeholder="Leer lassen, um Scans zu nutzen">
                <label for="editExpectedCount">Erwartete Gesamtstückzahl:</label>
                <input type="text" id="editExpectedCount" inputmode="numeric" placeholder="Zahl oder leer">
                <div class="row">
                    <button type="submit" class="btn primary">Speichern</button>
                    <button type="button" class="btn secondary" data-close-modal>Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Notiz bearbeiten -->
    <div id="noteEditModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" data-close-modal title="Schließen">×</button>
            <h2>Notiz bearbeiten</h2>
            <form id="note-edit-form">
                <label for="noteEditTextarea">Notiz:</label>
                <textarea id="noteEditTextarea" rows="3"></textarea>
                <div class="row">
                    <button type="submit" class="btn primary">Speichern</button>
                    <button type="button" class="btn secondary" data-close-modal>Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Scan-Feedback (Batch-Modus) -->
    <div id="batchFeedbackModal" class="modal-overlay hidden">
        <div class="modal-content feedback-card">
            <h2>✅ Scan erfasst</h2>
            <div id="batchFeedbackText" class="batch-feedback-text"></div>
            <button type="button" class="btn primary" data-close-modal>OK</button>
        </div>
    </div>

    <!-- Sounds (echte MP3s liegen in assets/) -->
    <audio id="errorSound" src="assets/error-sound.mp3" preload="auto"></audio>
    <audio id="nachlieferungSound" src="assets/nachlieferung-sound.mp3" preload="auto"></audio>

    <!-- Externe Libraries (exakt diese Versionen) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
